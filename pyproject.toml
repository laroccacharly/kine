[project]
name = "kine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "laroccacharly", email = "larocca.charly@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    "casadi>=3.7.2",
    "fastapi>=0.141.1",
    "modal>=1.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[project.scripts]
kine = "kine:main"
serve = "kine.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
